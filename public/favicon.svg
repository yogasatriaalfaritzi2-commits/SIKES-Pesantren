<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background rounded teal square / squircle -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Squircle / Rounded Container -->
  <rect x="5" y="5" width="90" height="90" rx="26" ry="26" fill="url(#tealGrad)" />

  <!-- Outlined Heart Shape -->
  <path d="M50 80 C26 62 18 48 18 34.5 C18 24.5 25.5 17.5 35 17.5 C41.5 17.5 47 21 50 25.5 C53 21 58.5 17.5 65 17.5 C74.5 17.5 82 24.5 82 34.5 C82 48 74 62 50 80 Z" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Heartbeat / EKG Pulse Line across the heart -->
  <path d="M12 51 L36 51 L43 38 L50 63 L57 32 L64 51 L88 51" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
