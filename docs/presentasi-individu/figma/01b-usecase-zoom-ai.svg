<text x="52.0" y="990.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  'Tanya Asisten AI' punya 2 mode: chat (intent lokal, hemat kuota) dan chatPro (analitik luas)</text>
<text x="52.0" y="1008.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  'Potong Konteks sesuai Role' = use case wajib (include) sebelum data masuk prompt</text>
<text x="52.0" y="1026.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  'Terima Notifikasi' bukan push — dihitung ulang tiap polling, jadi tidak ada tabel notifikasi</text>
<text x="52.0" y="1044.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  'Verifikasi QR Surat' satu-satunya use case publik (tanpa login, permission null)</text>
<text x="52.0" y="1062.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  'Konfigurasi Model AI' sengaja dikunci ke satu aktor (Super Admin) di controller, bukan di UI</text>
