<text x="112.0" y="640.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Aktor EKSTERNAL tanpa akun (petugas gerbang / wali) lewat rute publik ber-token</text>
<text x="112.0" y="658.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Verifikasi server-side: token dicek ke DB, bukan klaim di kertas → tidak bisa dipalsukan lewat UI</text>
<text x="112.0" y="676.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Pembatalan surat langsung membuat QR mati → ada alur balik (batal → tidak valid)</text>
<text x="112.0" y="694.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Kolom 'diverifikasi' tercatat di DB (sikes_db.sql:503) sebagai jejak audit</text>
<text x="112.0" y="712.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Menunjukkan batas keamanan: rute publik permission null, tapi tetap butuh token acak</text>
<rect x="1020.0" y="600.0" width="880.0" height="240.0" rx="4" fill="#FBF0DC" stroke="#8A5B13" stroke-width="1.5"/>
<text x="1032.0" y="622.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">AKTOR &amp; PERMISSION</text>
<text x="1032.0" y="640.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Admin Santri / Pengasuhan → surat.create, surat.cetak, surat.batal</text>
<text x="1032.0" y="658.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Petugas gerbang / publik → GET /verifikasi/{token} (tanpa login)</text>
<text x="1032.0" y="676.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Super Admin → audit: siapa menerbitkan, siapa memverifikasi, dari IP mana</text>
<text x="1032.0" y="694.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  Alur ini TIDAK memakai LLM — cocok untuk menegaskan bahwa AI hanya di modul asisten</text>
<text x="1032.0" y="712.0" font-family="Inter, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" fill="#8A5B13" text-anchor="start">·  QR = tautan, bukan penyimpanan data medis: hanya status sah/tidak + identitas singkat</text>
